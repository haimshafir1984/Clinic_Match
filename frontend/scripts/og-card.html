<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    width:1200px;height:630px;
    background:#f6f7fb;
    font-family:"Assistant","Arial Hebrew",sans-serif;
    color:#131a2c;
    display:flex;flex-direction:column;
    padding:64px 72px;
    position:relative;
    overflow:hidden;
  }
  .glow{
    position:absolute;top:-260px;left:-160px;
    width:760px;height:760px;border-radius:50%;
    background:radial-gradient(circle,#eeecfd 0%,rgba(238,236,253,0) 68%);
  }
  .top{display:flex;align-items:center;gap:14px;position:relative;}
  .mark{
    width:56px;height:56px;border-radius:16px;
    background:linear-gradient(140deg,#4f46e5,#7c74f0);
    display:grid;place-items:center;
    color:#fff;font-family:"Secular One";font-size:30px;
    box-shadow:0 10px 24px -8px rgba(79,70,229,.55);
  }
  .name{font-family:"Secular One";font-size:34px;letter-spacing:-.01em;}
  .body{flex:1;display:flex;align-items:center;gap:56px;position:relative;}
  .copy{flex:1;}
  h1{
    font-family:"Secular One";font-size:62px;line-height:1.16;
    font-weight:400;margin-bottom:22px;letter-spacing:-.01em;
  }
  h1 .hl{color:#4f46e5;}
  p{font-size:25px;color:#5b6478;line-height:1.5;max-width:19em;}
  .card{
    width:392px;background:#fff;border:1px solid #e4e7f0;
    border-radius:24px;padding:26px 24px;
    box-shadow:0 30px 60px -28px rgba(19,26,44,.32);
  }
  .row+.row{margin-top:20px;}
  .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;}
  .who{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;}
  .av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:800;}
  .av.w{background:#eeecfd;color:#3730a3;}
  .av.b{background:#fdf0dd;color:#c26a10;}
  .tag{font-size:13px;font-weight:700;color:#8b93a7;}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;}
  .d{
    aspect-ratio:1/1.14;border-radius:10px;background:#eef0f7;
    display:grid;place-items:center;font-size:15px;font-weight:700;color:#8b93a7;
    border:2px solid transparent;
  }
  .d.w{background:#eeecfd;color:#3730a3;border-color:rgba(79,70,229,.22);}
  .d.b{background:#fdf0dd;color:#c26a10;border-color:rgba(194,106,16,.26);}
  .d.m{background:#e2f3ea;color:#1a8a57;border-color:rgba(26,138,87,.42);}
  .res{
    margin-top:22px;padding-top:18px;border-top:2px dashed #e4e7f0;
    display:flex;align-items:center;gap:12px;
  }
  .badge{
    background:#e2f3ea;color:#1a8a57;font-size:15px;font-weight:800;
    padding:7px 16px;border-radius:999px;border:1px solid rgba(26,138,87,.28);
  }
  .sub{font-size:15px;color:#5b6478;}
  .foot{
    display:flex;gap:10px;position:relative;flex-wrap:wrap;
  }
  .chip{
    background:#fff;border:1px solid #e4e7f0;border-radius:11px;
    padding:9px 17px;font-size:17px;font-weight:600;color:#5b6478;
  }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="top">
    <div class="mark">S</div>
    <div class="name">ShiftMatch</div>
  </div>

  <div class="body">
    <div class="copy">
      <h1>המשמרת הבאה<br>מתחילה <span class="hl">בהחלקה אחת</span></h1>
      <p>התאמה בין עובדים לבתי עסק לפי ימי זמינות, אזור ותפקיד.</p>
    </div>

    <div class="card">
      <div class="row">
        <div class="rh">
          <div class="who"><span class="av w">ד״כ</span> דנה כ׳</div>
          <span class="tag">פנויה</span>
        </div>
        <div class="days">
          <div class="d">א</div><div class="d w">ב</div><div class="d w">ג</div>
          <div class="d">ד</div><div class="d w">ה</div><div class="d">ו</div><div class="d">ש</div>
        </div>
      </div>
      <div class="row">
        <div class="rh">
          <div class="who"><span class="av b">מ״ל</span> מרפאת לוי</div>
          <span class="tag">דרוש/ה</span>
        </div>
        <div class="days">
          <div class="d">א</div><div class="d b">ב</div><div class="d">ג</div>
          <div class="d">ד</div><div class="d b">ה</div><div class="d b">ו</div><div class="d">ש</div>
        </div>
      </div>
      <div class="row">
        <div class="rh">
          <div class="who" style="color:#1a8a57">חפיפה</div>
          <span class="tag">2 ימים</span>
        </div>
        <div class="days">
          <div class="d">א</div><div class="d m">ב</div><div class="d">ג</div>
          <div class="d">ד</div><div class="d m">ה</div><div class="d">ו</div><div class="d">ש</div>
        </div>
      </div>
      <div class="res">
        <span class="badge">התאמה ✓</span>
        <span class="sub">הצ׳אט נפתח אוטומטית</span>
      </div>
    </div>
  </div>

  <div class="foot">
    <span class="chip">רפואה</span>
    <span class="chip">מקצועות יומיים</span>
    <span class="chip">תקשורת</span>
    <span class="chip">ביטוח</span>
    <span class="chip">הייטק</span>
    <span class="chip">חינוך</span>
    <span class="chip">בנייה</span>
  </div>
</body>
</html>
