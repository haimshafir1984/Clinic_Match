services:
  - type: web
    name: shiftmatch-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JSEARCH_API_KEY
        sync: false
      - key: ENABLE_PUPPETEER_SCRAPING
        value: "false"
      - key: MARKET_JOBS_REFRESH_ENABLED
        value: "true"
      - key: MARKET_JOBS_REFRESH_INTERVAL_MINUTES
        value: "360"
      - key: MARKET_JOBS_TTL_DAYS
        value: "30"
      - key: ADMIN_EMAIL
        value: haim.shafir.1@gmail.com
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: shiftmatch-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
