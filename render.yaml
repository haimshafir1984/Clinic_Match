# Render Blueprint for ShiftMatch. See DEPLOYMENT.md before applying.
#
# IMPORTANT: the services currently running were created by hand in the
# dashboard and are named "Clinic_Match" (backend) and
# "clinic_match_frontend" (static site). Render matches blueprint
# services by NAME, so applying this file as-is creates a second pair of
# services rather than adopting the existing ones. Either rename the
# services in the dashboard to match the names below first, or change the
# names here to match them — decide before clicking apply.
#
# Every secret is sync:false, meaning Render will not read a value from this
# file; you still enter those in the dashboard. Nothing sensitive lives here.

services:
  - type: web
    name: shiftmatch-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JSEARCH_API_KEY
        sync: false
      - key: ENABLE_PUPPETEER_SCRAPING
        value: "false"
      - key: MARKET_JOBS_REFRESH_ENABLED
        value: "true"
      - key: MARKET_JOBS_REFRESH_INTERVAL_MINUTES
        value: "360"
      - key: MARKET_JOBS_TTL_DAYS
        value: "30"
      - key: ADMIN_EMAIL
        value: haim.shafir.1@gmail.com
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      # Resend (HTTPS) is the working mail path. Raw SMTP below is kept only
      # as a fallback for a paid instance or another host — Render's free
      # tier blocks outbound ports 25/465/587 entirely, so SMTP cannot work
      # there regardless of credentials.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: shiftmatch-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
