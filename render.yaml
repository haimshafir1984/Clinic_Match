# Render Blueprint for ShiftMatch. See DEPLOYMENT.md before applying.
#
# The live services (created by hand in the dashboard) were renamed to
# shiftmatch-backend / shiftmatch-frontend to match the names below, so
# applying this blueprint should adopt them rather than create a duplicate
# pair — Render matches blueprint services by name. Still worth confirming
# in a Render support ticket or a dry run before relying on it, since
# dashboard-created and blueprint-managed services aren't always identical
# under the hood.
#
# Every secret is sync:false, meaning Render will not read a value from this
# file; you still enter those in the dashboard. Nothing sensitive lives here.

services:
  - type: web
    name: shiftmatch-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JSEARCH_API_KEY
        sync: false
      - key: ENABLE_PUPPETEER_SCRAPING
        value: "false"
      - key: MARKET_JOBS_REFRESH_ENABLED
        value: "true"
      - key: MARKET_JOBS_REFRESH_INTERVAL_MINUTES
        value: "360"
      - key: MARKET_JOBS_TTL_DAYS
        value: "30"
      - key: ADMIN_EMAIL
        value: haim.shafir.1@gmail.com
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Resend (HTTPS) is the working mail path. Raw SMTP below is kept only
      # as a fallback for a paid instance or another host — Render's free
      # tier blocks outbound ports 25/465/587 entirely, so SMTP cannot work
      # there regardless of credentials.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: shiftmatch-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
