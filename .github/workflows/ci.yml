name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `vite build` does not type-check, so without this a type error can
      # still ship. The tree is clean as of d09b792 — keep it that way.
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Syntax-only check — doesn't install dependencies (skips the slow
      # Puppeteer/Chrome postinstall) since `node --check` never executes
      # require() calls, just parses the file.
      - name: Check backend syntax
        working-directory: backend
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -print0 \
            | xargs -0 -n1 node --check
